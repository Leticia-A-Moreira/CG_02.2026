<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Pong - Completo</title>
    <style>
        body { 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            margin: 0; 
            background-color: #222; 
            color: white;
            font-family: monospace;
        }
        #placar {
            display: flex;
            justify-content: space-between;
            width: 400px;
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 20px;
        }
        canvas { 
            border: 2px solid #fff; 
            background-color: #111;
            /* Cria a linha tracejada no centro exato do canvas */
            background-image: linear-gradient(to bottom, #555 50%, transparent 50%);
            background-size: 4px 40px;
            background-position: center;
            background-repeat: repeat-y;
        }

        #pontosEsquerda {
            color: rgb(0, 255, 0);
        }
        
        #pontosDireita {
            color: rgb(0, 0, 255);
        }
    </style>
</head>
<body>
    <div id="placar">
        <span id="pontosEsquerda">0</span>
        <span id="pontosDireita">0</span>
    </div>
    <canvas id="canvas" width="600" height="600"></canvas>
    
    <script src="08.09_m3.js"></script>
    <script src="08.09_main.js"></script>
</body>
</html>
